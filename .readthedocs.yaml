# .readthedocs.yaml

version: 2

# Указываем операционную систему для сборки (ВАЖНО!)
build:
  os: ubuntu-22.04 # Используем Ubuntu 22.04 LTS
  tools:
    python: "3.11" # Или другая нужная вам версия Python (опционально, но рекомендуется)
  # Добавляем пользовательские шаги сборки
  jobs:
    post_build:
      # Диагностика: Показываем содержимое текущей директории перед копированием
      - echo "--- Содержимое текущей директории перед копированием ---"
      - ls -la
      # Диагностика: Показываем содержимое _html_files
      - echo "--- Содержимое _html_files ---"
      - ls -la _html_files
      # Копируем файлы принудительно и рекурсивно, указывая явно
      - echo "--- Копирование файлов ---"
      - cp -rf _html_files/index.html $READTHEDOCS_OUTPUT/html/index.html
      - cp -rf _html_files/style.css $READTHEDOCS_OUTPUT/html/style.css
      # Диагностика: Показываем содержимое целевой директории ПОСЛЕ копирования
      - echo "--- Содержимое $READTHEDOCS_OUTPUT/html/ после копирования ---"
      - ls -la $READTHEDOCS_OUTPUT/html/
# Указываем, что проект использует Sphinx
sphinx:
  configuration: docs/conf.py  # Путь к вашему conf.py

# Указываем, как установить зависимости Python
python:
  install:
    - requirements: requirements.txt # Говорим использовать ваш requirements.txt

# (Опционально) Указываем, какие форматы собирать
formats:
 - htmlzip
 # - pdf # Раскомментируйте, если нужен PDF